<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아기 비행사 1942 : 알록달록 하늘 모험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            overflow: hidden;
        }
        .bounce-gentle {
            animation: bounceGentle 2s infinite ease-in-out;
        }
        @keyframes bounceGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .pulse-btn {
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .rainbow-text {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Custom game canvas wrapper */
        #canvas-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            border-radius: 2rem;
            overflow: hidden;
            border: 8px solid #ffffff;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- Main Game Wrapper -->
    <div class="w-full max-w-lg flex flex-col items-center">
        
        <!-- Header Info Bar -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 mb-2 shadow-lg flex items-center justify-between border-2 border-pink-200">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">❤️</span>
                <div id="hearts-container" class="flex space-x-1 text-xl sm:text-2xl text-red-500">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-yellow-100 px-3 py-1 rounded-full border border-yellow-300">
                <span class="text-xl">⭐</span>
                <span id="score-text" class="text-xl sm:text-2xl font-bold text-yellow-600">0</span>
            </div>
            <div class="flex items-center space-x-2 bg-blue-100 px-3 py-1 rounded-full border border-blue-300">
                <span class="text-sm text-blue-600 font-bold">STG</span>
                <span id="stage-text" class="text-lg font-bold text-blue-700">1</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="canvas-container" class="w-full h-[65vh] sm:h-[520px] bg-sky-200 relative">
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Touch Controls Overlay (Mobile friendly buttons) -->
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center pointer-events-none">
                <!-- Special 1942 Loop Dodge Button -->
                <button id="loop-btn" class="pointer-events-auto bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold px-4 py-3 rounded-full shadow-lg border-2 border-white flex items-center space-x-2 active:scale-95 transition-transform pulse-btn">
                    <i class="fa-solid fa-rotate-right text-xl"></i>
                    <span>공중 회전! (<span id="loop-count">3</span>)</span>
                </button>

                <!-- Auto-Fire Toggle Button -->
                <button id="autofire-btn" class="pointer-events-auto bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold px-4 py-3 rounded-full shadow-lg border-2 border-white flex items-center space-x-2 active:scale-95 transition-transform">
                    <i id="autofire-icon" class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                    <span id="autofire-text">자동 발사 ON</span>
                </button>
            </div>

            <!-- Start / Pause / Game Over Modals -->
            <!-- Start Screen Modal -->
            <div id="start-modal" class="absolute inset-0 bg-sky-400/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-yellow-300 max-w-xs w-full bounce-gentle">
                    <div class="text-5xl mb-2">🛩️✨</div>
                    <h1 class="text-3xl font-black text-sky-600 mb-1">아기 비행사 1942</h1>
                    <p class="text-gray-500 text-sm mb-4 font-bold">알록달록 풍선을 터뜨리고 별을 모아요!</p>
                    <button id="start-btn" class="w-full bg-gradient-to-r from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white text-2xl font-black py-4 rounded-2xl shadow-xl transform active:scale-95 transition-transform border-b-4 border-purple-700">
                        게임 시작! 🚀
                    </button>
                    <div class="mt-4 text-xs text-gray-400 space-y-1">
                        <p>💡 화면을 마우스나 터치로 이끌어주세요!</p>
                        <p>🌀 위험할 땐 [공중 회전!] 버튼을 터치!</p>
                    </div>
                </div>
            </div>

            <!-- Stage Clear / Win Modal -->
            <div id="stage-modal" class="hidden absolute inset-0 bg-yellow-400/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-pink-300 max-w-xs w-full bounce-gentle">
                    <div class="text-6xl mb-2">🏆🎉</div>
                    <h2 class="text-3xl font-black text-purple-600 mb-2" id="stage-clear-title">스테이지 성공!</h2>
                    <p class="text-gray-600 mb-4 font-bold" id="stage-clear-desc">참 잘했어요! 다음 하늘로 이동합니다.</p>
                    <button id="next-stage-btn" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-2xl font-black py-3 rounded-2xl shadow-lg transform active:scale-95 transition border-b-4 border-emerald-700">
                        다음 단계로! ✈️
                    </button>
                </div>
            </div>

            <!-- Game Over / Restart Modal -->
            <div id="gameover-modal" class="hidden absolute inset-0 bg-indigo-900/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-sky-300 max-w-xs w-full">
                    <div class="text-5xl mb-2">🎈💖</div>
                    <h2 class="text-3xl font-black text-sky-600 mb-1">한 번 더 도전!</h2>
                    <p class="text-gray-500 text-sm mb-3">모은 무지개 별: <span id="final-stars" class="text-yellow-500 font-bold text-xl">0</span>개</p>
                    <button id="restart-btn" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 text-white text-2xl font-black py-3 rounded-2xl shadow-lg transform active:scale-95 transition border-b-4 border-yellow-600">
                        다시 하기 🔄
                    </button>
                </div>
            </div>
        </div>

        <!-- Instructions Footer -->
        <div class="w-full text-center mt-3 text-xs text-sky-800 font-bold bg-white/50 p-2 rounded-xl backdrop-blur-xs">
            ✨ 쉬운 무제한 비눗방울 슈팅 | 위험할 땐 회전 스킬로 360도 무적 회피!
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer for Kid-Friendly Sounds ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playStar() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playLoopSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.3);
                osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            }

            playPowerup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.15);
                });
            }

            playHurt() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const sound = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game state variables
        let gameActive = false;
        let score = 0;
        let hearts = 3;
        let stage = 1;
        let loopSkillCount = 3;
        let autoFire = true;
        let frameCount = 0;

        // Player state
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            targetX: canvas.width / 2,
            targetY: canvas.height - 100,
            radius: 26,
            speed: 0.2,
            isLooping: false,
            loopAngle: 0,
            loopScale: 1,
            invincible: false,
            invincibleTimer: 0,
            weaponPower: 1, // 1: normal, 2: double bubble, 3: rainbow beam
            weaponTimer: 0,
            propellerAngle: 0
        };

        // Entities arrays
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let items = [];
        let backgroundClouds = [];

        function initClouds() {
            backgroundClouds = [];
            for (let i = 0; i < 8; i++) {
                backgroundClouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: 30 + Math.random() * 50,
                    speed: 0.5 + Math.random() * 0.8,
                    opacity: 0.4 + Math.random() * 0.4
                });
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Blink if invincible after hurt
            if (player.invincible && !player.isLooping && Math.floor(frameCount / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // 1942 Signature Loop-De-Loop scaling & rotation
            if (player.isLooping) {
                ctx.rotate(player.loopAngle);
                ctx.scale(player.loopScale, player.loopScale);
            }

            // Shield Bubble Effect
            if (player.weaponPower === 3) {
                ctx.beginPath();
                ctx.arc(0, 0, player.radius + 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 230, 0, 0.25)';
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 3;
                ctx.fill();
                ctx.stroke();
            }

            // Cute Toy Plane Graphics (Bright Pastel Yellow & Red)
            // Wings
            ctx.fillStyle = '#ff5e7e';
            ctx.beginPath();
            ctx.roundRect(-36, -6, 72, 14, 6);
            ctx.fill();
            ctx.strokeStyle = '#e03b5d';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Body
            ctx.fillStyle = '#ffdd59';
            ctx.beginPath();
            ctx.ellipse(0, 0, 16, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffa801';
            ctx.stroke();

            // Cockpit (Glass bubble with cute pilot face)
            ctx.fillStyle = '#4bcffa';
            ctx.beginPath();
            ctx.arc(0, -6, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0bc2f9';
            ctx.stroke();

            // Pilot Bear Ears / Hat
            ctx.fillStyle = '#ffa801';
            ctx.beginPath();
            ctx.arc(-5, -12, 4, 0, Math.PI * 2);
            ctx.arc(5, -12, 4, 0, Math.PI * 2);
            ctx.fill();

            // Cute Pilot Eyes
            ctx.fillStyle = '#1e272e';
            ctx.beginPath();
            ctx.arc(-3, -7, 1.8, 0, Math.PI * 2);
            ctx.arc(3, -7, 1.8, 0, Math.PI * 2);
            ctx.fill();

            // Tail Wings
            ctx.fillStyle = '#ff5e7e';
            ctx.beginPath();
            ctx.roundRect(-16, 22, 32, 8, 3);
            ctx.fill();

            // Animated Propeller
            ctx.save();
            ctx.translate(0, -32);
            ctx.rotate(player.propellerAngle);
            ctx.fillStyle = '#d2dae2';
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        class Enemy {
            constructor(type = 'balloon') {
                this.type = type; // 'balloon', 'cloud', 'boss'
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -50;
                this.radius = type === 'boss' ? 55 : (type === 'cloud' ? 32 : 22);
                this.speed = type === 'boss' ? 1.2 : (1.5 + Math.random() * 1.5);
                this.hp = type === 'boss' ? 35 : (type === 'cloud' ? 3 : 1);
                this.maxHp = this.hp;
                this.angle = 0;
                this.wobbleSpeed = 0.05 + Math.random() * 0.05;
                this.color = type === 'balloon' 
                    ? ['#ff4d4d', '#ff9f43', '#10ac84', '#00d2d3', '#5f27cd'][Math.floor(Math.random() * 5)]
                    : '#ffffff';
            }

            update() {
                this.y += this.speed;
                this.angle += this.wobbleSpeed;
                this.x += Math.sin(this.angle) * (this.type === 'boss' ? 2 : 1.2);

                // Boss shoot bubble attacks
                if (this.type === 'boss' && frameCount % 60 === 0) {
                    this.shootAttack();
                }
            }

            shootAttack() {
                enemyBullets.push({
                    x: this.x,
                    y: this.y + 30,
                    vx: -1.5,
                    vy: 3,
                    radius: 8,
                    color: '#ff7675'
                });
                enemyBullets.push({
                    x: this.x,
                    y: this.y + 30,
                    vx: 1.5,
                    vy: 3,
                    radius: 8,
                    color: '#ff7675'
                });
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'balloon') {
                    // Cute Colorful Balloon Enemy
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Balloon highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(-6, -6, 6, 0, Math.PI * 2);
                    ctx.fill();

                    // Smiling Face
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(-6, 0, 2.5, 0, Math.PI * 2);
                    ctx.arc(6, 0, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 4, 5, 0, Math.PI);
                    ctx.stroke();

                    // Ribbon at bottom
                    ctx.fillStyle = '#888';
                    ctx.fillRect(-2, this.radius, 4, 10);
                } 
                else if (this.type === 'cloud') {
                    // Playful Cloud Monster
                    ctx.fillStyle = '#f1f2f6';
                    ctx.beginPath();
                    ctx.arc(-15, 0, 18, 0, Math.PI * 2);
                    ctx.arc(15, 0, 18, 0, Math.PI * 2);
                    ctx.arc(0, -12, 22, 0, Math.PI * 2);
                    ctx.arc(0, 10, 16, 0, Math.PI * 2);
                    ctx.fill();

                    // Cheek blush
                    ctx.fillStyle = '#ffafbd';
                    ctx.beginPath();
                    ctx.arc(-14, 4, 5, 0, Math.PI * 2);
                    ctx.arc(14, 4, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Playful Eyes
                    ctx.fillStyle = '#2f3542';
                    ctx.beginPath();
                    ctx.arc(-8, -2, 3, 0, Math.PI * 2);
                    ctx.arc(8, -2, 3, 0, Math.PI * 2);
                    ctx.fill();
                } 
                else if (this.type === 'boss') {
                    // Giant Friendly Cloud Boss
                    ctx.fillStyle = '#eccc68';
                    ctx.beginPath();
                    ctx.arc(-30, 0, 35, 0, Math.PI * 2);
                    ctx.arc(30, 0, 35, 0, Math.PI * 2);
                    ctx.arc(0, -25, 45, 0, Math.PI * 2);
                    ctx.fill();

                    // Crown
                    ctx.fillStyle = '#ffa502';
                    ctx.beginPath();
                    ctx.moveTo(-20, -55);
                    ctx.lineTo(-10, -35);
                    ctx.lineTo(0, -60);
                    ctx.lineTo(10, -35);
                    ctx.lineTo(20, -55);
                    ctx.lineTo(25, -25);
                    ctx.lineTo(-25, -25);
                    ctx.closePath();
                    ctx.fill();

                    // Boss HP Bar
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(-40, -70, 80, 8);
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(-40, -70, (this.hp / this.maxHp) * 80, 8);
                }

                ctx.restore();
            }
        }

        function spawnPlayerBullet() {
            sound.playPop();

            if (player.weaponPower === 1) {
                // Single Soap Bubble Shot
                bullets.push({
                    x: player.x,
                    y: player.y - 30,
                    vx: 0,
                    vy: -9,
                    radius: 8,
                    color: '#00d2d3'
                });
            } else if (player.weaponPower === 2) {
                // Double Bubble Shot
                bullets.push({
                    x: player.x - 12,
                    y: player.y - 25,
                    vx: -0.5,
                    vy: -9,
                    radius: 9,
                    color: '#ff9ff3'
                });
                bullets.push({
                    x: player.x + 12,
                    y: player.y - 25,
                    vx: 0.5,
                    vy: -9,
                    radius: 9,
                    color: '#ff9ff3'
                });
            } else {
                // Triple Rainbow Bubble Power!
                [-1.5, 0, 1.5].forEach(vx => {
                    bullets.push({
                        x: player.x,
                        y: player.y - 30,
                        vx: vx,
                        vy: -10,
                        radius: 11,
                        color: '#feca57'
                    });
                });
            }
        }

        function createPopParticles(x, y, color = '#ff9ff3') {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 4,
                    color: color,
                    alpha: 1,
                    decay: 0.03
                });
            }
        }

        function spawnItem(x, y) {
            const types = ['star', 'star', 'star', 'heart', 'powerup'];
            const chosen = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: x,
                y: y,
                type: chosen,
                radius: 14,
                vy: 1.2
            });
        }

        function triggerLoopSkill() {
            if (loopSkillCount <= 0 || player.isLooping || !gameActive) return;

            loopSkillCount--;
            document.getElementById('loop-count').innerText = loopSkillCount;
            sound.playLoopSound();

            player.isLooping = true;
            player.invincible = true;

            let startTime = performance.now();
            let duration = 900; // 0.9 seconds 360 loop animation

            function animateLoop(now) {
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / duration, 1);

                // 360 rotation & size pulse
                player.loopAngle = progress * Math.PI * 2;
                player.loopScale = 1 + Math.sin(progress * Math.PI) * 0.6;

                // Loop clears nearby bullets/enemies
                enemyBullets.forEach((eb, idx) => {
                    const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
                    if (dist < 120) {
                        createPopParticles(eb.x, eb.y, eb.color);
                        enemyBullets.splice(idx, 1);
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(animateLoop);
                } else {
                    player.isLooping = false;
                    player.loopAngle = 0;
                    player.loopScale = 1;
                    player.invincible = false;
                }
            }
            requestAnimationFrame(animateLoop);
        }

        function updateGame() {
            if (!gameActive) return;

            frameCount++;
            player.propellerAngle += 0.4;

            // Smooth Interpolation to touch/mouse target position
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;

            // Keep inside screen bounds
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Auto Shooting
            if (autoFire && frameCount % 12 === 0) {
                spawnPlayerBullet();
            }

            // Powerup Weapon Timer decay
            if (player.weaponTimer > 0) {
                player.weaponTimer--;
                if (player.weaponTimer <= 0) {
                    player.weaponPower = 1;
                }
            }

            // Invincible Timer
            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0 && !player.isLooping) {
                    player.invincible = false;
                }
            }

            // Background Clouds
            backgroundClouds.forEach(c => {
                c.y += c.speed;
                if (c.y > canvas.height + 50) {
                    c.y = -50;
                    c.x = Math.random() * canvas.width;
                }
            });

            // Update Bullets
            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) {
                    bullets.splice(index, 1);
                }
            });

            // Update Enemy Bullets
            enemyBullets.forEach((eb, index) => {
                eb.x += eb.vx;
                eb.y += eb.vy;

                // Hit player check
                if (!player.invincible) {
                    const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
                    if (dist < player.radius + eb.radius) {
                        hurtPlayer();
                        enemyBullets.splice(index, 1);
                    }
                }

                if (eb.y > canvas.height + 20) {
                    enemyBullets.splice(index, 1);
                }
            });

            // Spawn Enemies according to Stage
            if (frameCount % Math.max(25, 70 - stage * 10) === 0 && enemies.filter(e => e.type !== 'boss').length < 8) {
                enemies.push(new Enemy(Math.random() < 0.3 ? 'cloud' : 'balloon'));
            }

            // Spawn Boss at 30 Stars per Stage
            if (score >= stage * 25 && !enemies.some(e => e.type === 'boss')) {
                enemies.push(new Enemy('boss'));
            }

            // Update Enemies & Bullet Collisions
            enemies.forEach((enemy, eIndex) => {
                enemy.update();

                // Check collision with player bullets
                bullets.forEach((bullet, bIndex) => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (dist < enemy.radius + bullet.radius) {
                        createPopParticles(bullet.x, bullet.y, bullet.color);
                        bullets.splice(bIndex, 1);
                        enemy.hp--;

                        if (enemy.hp <= 0) {
                            sound.playPop();
                            createPopParticles(enemy.x, enemy.y, enemy.color);
                            spawnItem(enemy.x, enemy.y);

                            if (enemy.type === 'boss') {
                                handleStageClear();
                            }

                            enemies.splice(eIndex, 1);
                        }
                    }
                });

                // Check collision with Player
                if (!player.invincible) {
                    const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                    if (dist < enemy.radius + player.radius) {
                        hurtPlayer();
                    }
                }

                // Remove off-screen enemies
                if (enemy.y > canvas.height + 60) {
                    enemies.splice(eIndex, 1);
                }
            });

            // Update Items
            items.forEach((item, idx) => {
                item.y += item.vy;

                // Magnet attraction toward player
                const dist = Math.hypot(item.x - player.x, item.y - player.y);
                if (dist < 100) {
                    item.x += (player.x - item.x) * 0.1;
                    item.y += (player.y - item.y) * 0.1;
                }

                // Pick up item
                if (dist < player.radius + item.radius) {
                    if (item.type === 'star') {
                        score += 1;
                        document.getElementById('score-text').innerText = score;
                        sound.playStar();
                        createPopParticles(item.x, item.y, '#f1c40f');
                    } else if (item.type === 'heart') {
                        if (hearts < 3) {
                            hearts++;
                            updateHeartsDisplay();
                        }
                        sound.playPowerup();
                    } else if (item.type === 'powerup') {
                        player.weaponPower = Math.min(3, player.weaponPower + 1);
                        player.weaponTimer = 300; // 5 sec power
                        sound.playPowerup();
                    }
                    items.splice(idx, 1);
                }

                if (item.y > canvas.height + 30) {
                    items.splice(idx, 1);
                }
            });

            // Update Particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                }
            });
        }

        function hurtPlayer() {
            sound.playHurt();
            hearts--;
            updateHeartsDisplay();

            player.invincible = true;
            player.invincibleTimer = 90; // ~1.5 sec invincibility

            if (hearts <= 0) {
                gameOver();
            }
        }

        function updateHeartsDisplay() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < hearts) {
                    container.innerHTML += '<i class="fa-solid fa-heart"></i>';
                } else {
                    container.innerHTML += '<i class="fa-regular fa-heart opacity-30"></i>';
                }
            }
        }

        function handleStageClear() {
            gameActive = false;
            sound.playPowerup();
            document.getElementById('stage-clear-title').innerText = `Stage ${stage} 성공! 🌟`;
            document.getElementById('stage-modal').classList.remove('hidden');
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('final-stars').innerText = score;
            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sky Background
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#74b9ff');
            skyGradient.addColorStop(1, '#a1c4fd');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background Clouds
            backgroundClouds.forEach(c => {
                ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity})`;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.5, c.y - c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x - c.size * 0.5, c.y - c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Items
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                if (item.type === 'star') {
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', 0, 0);
                } else if (item.type === 'heart') {
                    ctx.font = '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💖', 0, 0);
                } else {
                    ctx.font = '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🌈', 0, 0);
                }
                ctx.restore();
            });

            // Draw Bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw Enemy Bullets
            enemyBullets.forEach(eb => {
                ctx.fillStyle = eb.color;
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Enemies
            enemies.forEach(e => e.draw());

            // Draw Player
            drawPlayer();

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        }

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (!autoFire) spawnPlayerBullet();
        });

        // Loop Button Event
        document.getElementById('loop-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            triggerLoopSkill();
        });

        // Auto Fire Toggle Event
        document.getElementById('autofire-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            autoFire = !autoFire;
            const btnText = document.getElementById('autofire-text');
            btnText.innerText = autoFire ? '자동 발사 ON' : '수동 터치 발사';
        });

        // Start Game
        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            document.getElementById('start-modal').classList.add('hidden');
            resetGame();
            gameActive = true;
        });

        // Next Stage Button
        document.getElementById('next-stage-btn').addEventListener('click', () => {
            stage++;
            document.getElementById('stage-text').innerText = stage;
            loopSkillCount = Math.min(5, loopSkillCount + 2);
            document.getElementById('loop-count').innerText = loopSkillCount;
            document.getElementById('stage-modal').classList.add('hidden');
            enemies = [];
            bullets = [];
            enemyBullets = [];
            gameActive = true;
        });

        // Restart Button
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('gameover-modal').classList.add('hidden');
            resetGame();
            gameActive = true;
        });

        function resetGame() {
            score = 0;
            hearts = 3;
            stage = 1;
            loopSkillCount = 3;
            document.getElementById('score-text').innerText = '0';
            document.getElementById('stage-text').innerText = '1';
            document.getElementById('loop-count').innerText = '3';
            updateHeartsDisplay();
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.targetX = canvas.width / 2;
            player.targetY = canvas.height - 100;
            player.weaponPower = 1;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            items = [];
            particles = [];
        }

        window.onload = function() {
            initClouds();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
